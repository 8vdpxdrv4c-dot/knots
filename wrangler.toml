# Cloudflare Pages project. `pnpm deploy:pages` builds and uploads build/client to production (branch main),
# `pnpm deploy:pages:preview` to a preview URL. The custom domain is
# attached to the project in the Cloudflare dashboard (and set as SITE_URL in src/app/shared/site.ts).
name = "knots-made-easy"
pages_build_output_dir = "./build/client"
compatibility_date = "2026-10-01"
