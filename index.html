<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knots Made Easy</title>
    <meta
      name="description"
      content="See how knots are tied, step by step, with a physically simulated rope."
    />
  </head>
  <body>
    <canvas
      id="scene"
      aria-label="3D view of the rope. Drag to turn it, scroll or pinch to zoom."
    ></canvas>

    <header class="intro">
      <p class="eyebrow">Knots made easy</p>
      <h1 id="knot-name"></h1>
      <p id="knot-summary"></p>
    </header>

    <section class="player" aria-label="Playback">
      <p class="step">
        <span id="step-num" class="step-num"></span><span id="step-title" aria-live="polite"></span>
      </p>
      <div class="bar">
        <button id="play" class="play" type="button" aria-label="Play">
          <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13l10.5-6.5z" />
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" />
          </svg>
        </button>
        <div class="track">
          <div class="rail">
            <div id="ready" class="ready"></div>
            <div id="played" class="played"></div>
          </div>
          <ol id="ticks" class="ticks"></ol>
          <input id="scrub" type="range" min="0" step="0.01" value="0" aria-label="Timeline" />
        </div>
        <span id="clock" class="clock">0.0s</span>
        <div class="speed" role="radiogroup" aria-label="Speed">
          <label><input type="radio" name="speed" value="0.25" /><span>¼×</span></label>
          <label><input type="radio" name="speed" value="0.5" /><span>½×</span></label>
          <label><input type="radio" name="speed" value="1" checked /><span>1×</span></label>
          <label><input type="radio" name="speed" value="2" /><span>2×</span></label>
        </div>
        <button id="loop" class="loop" type="button" aria-pressed="false" aria-label="Loop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7h9.5l-2-2M17 17H7.5l2 2M4 12a5 5 0 0 1 3-5M20 12a5 5 0 0 1-3 5" />
          </svg>
        </button>
      </div>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
